name: IMP Agent CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Validate and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run authentication, persona, and chat tests
        run: npm run test:unit
      - name: Package browser widget
        run: npm run package:widget
      - name: Package Chrome Web Store draft
        run: npm run package:store
      - name: Preserve installable widget pilot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ask-imp-widget
          path: dist/ask-imp-widget.zip
          if-no-files-found: error
          retention-days: 30
      - name: Preserve Web Store draft package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ask-imp-webstore-draft
          path: dist/ask-imp-webstore.zip
          if-no-files-found: error
          retention-days: 30

  persona-queries:
    name: Persona query browser contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test queries and clarification for all five personas
        run: |
          mkdir -p test-results
          npm run test:queries:ci
      - name: Preserve query test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: persona-query-browser-results
          path: test-results/*.xml
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy to ask.impops.work
    needs: [test, persona-queries]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: imp-agent-production
      cancel-in-progress: false
    steps:
      - name: Check out tested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js for verification
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Check deployment credential
        env:
          DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_IMP_AGENT }}
        run: |
          if [ -z "$DEPLOYMENT_TOKEN" ]; then
            echo "::error::Missing repository secret AZURE_STATIC_WEB_APPS_API_TOKEN_IMP_AGENT"
            exit 1
          fi
      - name: Deploy standalone agent to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_IMP_AGENT }}
          action: upload
          app_location: web
          api_location: ''
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          production_branch: main
      - name: Verify deployed routes and release files
        run: npm run verify:deployment
        env:
          DEPLOYMENT_URL: https://ask.impops.work
